<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Китайские прилагательные</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(at 15% 0%, #34436b, transparent 38%),
        #101827;
    color: #f5f7fb;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
}

header, .tools, .grid, footer {
    width: 100%;
    max-width: 1400px;
    margin-left: auto;
    margin-right: auto;
    padding-left: 12px;
    padding-right: 12px;
}

header {
    flex: 0 0 auto;
    padding-top: 8px;
    padding-bottom: 4px;
}

.k {
    color: #6ee7c2;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .15em;
}

h1 {
    font-size: clamp(18px, 2.5vw, 30px);
    line-height: 1.04;
    margin: 3px 0;
}

.sub {
    color: #aab8ca;
    line-height: 1.25;
    margin: 3px 0;
    font-size: clamp(9px, 1vw, 12px);
}

.tools {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    padding-top: 5px;
    padding-bottom: 6px;
}

.search {
    flex: 1;
    min-width: 100px;
    background: #111d2e;
    border: 1px solid #40516b;
    border-radius: 10px;
    padding: 8px;
    color: white;
    font-size: 12px;
}

.btn {
    border: 1px solid #40516b;
    background: #263650;
    color: white;
    border-radius: 9px;
    padding: 7px 9px;
    font-size: 11px;
    font-weight: 750;
    cursor: pointer;
}

.btn:disabled {
    opacity: .35;
    cursor: default;
}

.primary {
    background: linear-gradient(130deg, #9279ed, #538fe8);
    border: 0;
}

.count {
    color: #aab8ca;
    font-size: 10px;
    white-space: nowrap;
}

.grid {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    grid-template-rows: repeat(4, minmax(0, 1fr));
    gap: 6px;
    padding-top: 2px;
    padding-bottom: 5px;
}

.card {
    min-width: 0;
    min-height: 0;
    background: linear-gradient(145deg, #263751, #182438);
    border: 1px solid #3a4e69;
    border-radius: 11px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    box-shadow: 0 5px 12px #050b1650;
    overflow: hidden;
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.tag {
    font-size: clamp(6px, .7vw, 9px);
    letter-spacing: .08em;
    text-transform: uppercase;
    color: #aab8ca;
    font-weight: 800;
}

.emoji {
    font-size: clamp(12px, 1.5vw, 20px);
}

.ru {
    font-size: clamp(10px, 1.2vw, 17px);
    font-weight: 850;
    line-height: 1.05;
    overflow-wrap: anywhere;
}

.cnrow {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
}

.cn {
    font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
    font-size: clamp(22px, 2.7vw, 38px);
    font-weight: 850;
    line-height: 1;
}

.py {
    color: #6ee7c2;
    font-size: clamp(8px, .9vw, 12px);
    font-weight: 800;
}

.en {
    color: #aab8ca;
    font-size: clamp(7px, .7vw, 9px);
    margin-top: 2px;
}

.pair {
    font-size: clamp(7px, .75vw, 10px);
    color: #f6d58a;
    font-weight: 750;
    line-height: 1.05;
}

.example {
    margin-top: auto;
    background: #111d2d;
    border: 1px solid #344760;
    border-radius: 7px;
    padding: 4px;
}

.excn {
    font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
    font-size: clamp(9px, 1vw, 13px);
    font-weight: 750;
    line-height: 1.05;
}

.expy {
    font-size: clamp(7px, .7vw, 9px);
    color: #6ee7c2;
    margin-top: 2px;
    line-height: 1.05;
}

.exru {
    font-size: clamp(7px, .75vw, 10px);
    color: #e1e8f2;
    margin-top: 2px;
    line-height: 1.05;
}

.actions {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
}

.listen, .record {
    border: 0;
    border-radius: 6px;
    padding: 4px 6px;
    font-size: clamp(7px, .75vw, 10px);
    font-weight: 800;
    cursor: pointer;
}

.listen {
    background: #e9e5ff;
    color: #32265e;
}

.record {
    background: #25434a;
    color: #baf5e3;
}

.status {
    font-size: 8px;
    color: #aab8ca;
    min-height: 8px;
    overflow: hidden;
}

footer {
    display: none;
}

/* Телефон: 3 столбца × 5 рядов */
@media (max-width: 700px) {
    header {
        padding-top: 5px;
        padding-bottom: 2px;
    }

    h1 {
        font-size: 17px;
    }

    .sub {
        font-size: 9px;
    }

    .tools {
        gap: 4px;
        padding-top: 3px;
        padding-bottom: 4px;
    }

    .search {
        padding: 6px;
        font-size: 10px;
    }

    .btn {
        padding: 5px 6px;
        font-size: 9px;
    }

    .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        grid-template-rows: repeat(5, minmax(0, 1fr));
        gap: 4px;
    }

    .card {
        padding: 4px;
        gap: 2px;
        border-radius: 7px;
    }

    .ru {
        font-size: clamp(9px, 2.7vw, 14px);
    }

    .cn {
        font-size: clamp(20px, 6vw, 34px);
    }

    .py {
        font-size: clamp(8px, 2vw, 11px);
    }

    .emoji {
        font-size: 13px;
    }

    .tag {
        font-size: 6px;
    }

    .en, .pair {
        font-size: 7px;
    }

    .example {
        padding: 3px;
    }

    .excn {
        font-size: clamp(8px, 2vw, 11px);
    }

    .expy, .exru {
        font-size: 7px;
    }

    .listen, .record {
        font-size: 7px;
        padding: 3px 4px;
    }

    .status {
        font-size: 6px;
        min-height: 5px;
    }
}

/* Телефон горизонтально: 5 столбцов × 3 ряда */
@media (max-height: 520px) and (min-width: 500px) {
    header {
        padding-top: 2px;
        padding-bottom: 1px;
    }

    h1 {
        font-size: 15px;
    }

    .sub {
        display: none;
    }

    .tools {
        padding-top: 2px;
        padding-bottom: 3px;
    }

    .grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: 3px;
    }

    .card {
        padding: 3px;
        gap: 1px;
    }

    .cn {
        font-size: clamp(18px, 4vh, 27px);
    }

    .ru {
        font-size: clamp(8px, 2vh, 12px);
    }

    .example {
        padding: 2px;
    }

    .excn, .expy, .exru {
        font-size: 7px;
    }

    .listen, .record {
        font-size: 6px;
        padding: 2px 3px;
    }
}
</style>
</head>

<body>

<header>
    <div class="k">中文词汇 · 形容词</div>
    <h1>Прилагательные на китайском</h1>
    <p class="sub">
        Русское слово → иероглифы → пиньинь.
        Нажмите «Слушать», чтобы услышать произношение.
    </p>
</header>

<div class="tools">
    <input
        id="search"
        class="search"
        placeholder="Поиск по-русски, иероглифам или пиньиню"
    >

    <button id="all" class="btn primary">▶ Всё подряд</button>
    <button id="stop" class="btn">■ Стоп</button>
    <button id="prev" class="btn">←</button>
    <button id="next" class="btn">→</button>

    <span id="count" class="count"></span>
</div>

<main id="grid" class="grid"></main>

<footer>
    Озвучка работает через голосовые движки устройства.
    Запись голоса сохраняется локально в этом браузере.
</footer>

<script>
  const data = [
["Большой","大","dà","big","🐘","Размер","Маленький — 小","大象很大。","Dàxiàng hěn dà.","Слон очень большой."],
["Маленький","小","xiǎo","small","🐭","Размер","Большой — 大","这只猫很小。","Zhè zhī māo hěn xiǎo.","Эта кошка очень маленькая."],
["Новый","新","xīn","new","🧸","Состояние","Старый — 旧","这是一本新书。","Zhè shì yì běn xīn shū.","Это новая книга."],
["Старый","旧","jiù","old / used","🧸","Состояние","Новый — 新","这是一辆旧车。","Zhè shì yí liàng jiù chē.","Это старая машина."],
["Длинный","长","cháng","long","🐍","Размер","Короткий — 短","这条蛇很长。","Zhè tiáo shé hěn cháng.","Эта змея очень длинная."],
["Короткий","短","duǎn","short","📏","Размер","Длинный — 长","这条裙子很短。","Zhè tiáo qúnzi hěn duǎn.","Это платье короткое."],
["Жаркий / горячий","热","rè","hot","☀️","Температура","Холодный — 冷","今天很热。","Jīntiān hěn rè.","Сегодня жарко."],
["Холодный","冷","lěng","cold","☃️","Температура","Жаркий — 热","外面很冷。","Wàimiàn hěn lěng.","На улице холодно."],
["Занятой","忙","máng","busy","📚","Состояние","Свободный — 闲","我今天很忙。","Wǒ jīntiān hěn máng.","Я сегодня очень занят(а)."],
["Свободный","闲","xián","free / not busy","🍵","Состояние","Занятой — 忙","我今天不忙。","Wǒ jīntiān bù máng.","Я сегодня не занят(а)."],
["Красивый","漂亮","piàoliang","beautiful","🌸","Качество","","这朵花很漂亮。","Zhè duǒ huā hěn piàoliang.","Этот цветок очень красивый."],
["Чистый","干净","gānjìng","clean","✨","Качество","Грязный — 脏","房间很干净。","Fángjiān hěn gānjìng.","Комната очень чистая."],
["Хороший","好","hǎo","good","👍","Оценка","Плохой — 坏","这个主意很好。","Zhège zhǔyi hěn hǎo.","Эта идея очень хорошая."],
["Плохой","坏","huài","bad","👎","Оценка","Хороший — 好","这个习惯不好。","Zhège xíguàn bù hǎo.","Эта привычка нехорошая."],
["Высокий","高","gāo","tall / high","🏙️","Размер","Невысокий — 矮","他很高。","Tā hěn gāo.","Он высокий."],
["Невысокий","矮","ǎi","short (height)","🌱","Размер","Высокий — 高","这张桌子很矮。","Zhè zhāng zhuōzi hěn ǎi.","Этот стол низкий."],
["Полный / толстый","胖","pàng","plump","🐼","Внешность","Худой — 瘦","这只熊猫胖胖的。","Zhè zhī xióngmāo pàngpàng de.","Эта панда пухленькая."],
["Худой","瘦","shòu","thin / slim","🦒","Внешность","Полный — 胖","这只猫很瘦。","Zhè zhī māo hěn shòu.","Эта кошка очень худая."],
["Быстрый","快","kuài","fast","🚀","Скорость","Медленный — 慢","他跑得很快。","Tā pǎo de hěn kuài.","Он бегает очень быстро."],
["Медленный","慢","màn","slow","🐢","Скорость","Быстрый — 快","乌龟走得很慢。","Wūguī zǒu de hěn màn.","Черепаха ходит очень медленно."],
["Дорогой","贵","guì","expensive","💎","Цена","Дешёвый — 便宜","这件衣服很贵。","Zhè jiàn yīfu hěn guì.","Эта одежда очень дорогая."],
["Дешёвый","便宜","piányi","cheap","🏷️","Цена","Дорогой — 贵","这个苹果很便宜。","Zhège píngguǒ hěn piányi.","Это яблоко очень дешёвое."],
["Сладкий","甜","tián","sweet","🍬","Вкус","Горький — 苦","这个蛋糕很甜。","Zhège dàngāo hěn tián.","Этот торт очень сладкий."],
["Далёкий","远","yuǎn","far","🌄","Расстояние","Близкий — 近","学校离这里很远。","Xuéxiào lí zhèlǐ hěn yuǎn.","Школа находится далеко отсюда."],
["Близкий","近","jìn","near","📍","Расстояние","Далёкий — 远","商店离我家很近。","Shāngdiàn lí wǒ jiā hěn jìn.","Магазин находится близко к моему дому."]
];
  const grid = document.querySelector("#grid");
const search = document.querySelector("#search");
const count = document.querySelector("#count");
const prev = document.querySelector("#prev");
const next = document.querySelector("#next");

const rec = {};

data.forEach((_, i) => {
    const value = localStorage.getItem("adj-rec-" + i);
    if (value) rec[i] = value;
});

let page = 0;
let filtered = [];
let activeRecorder = null;
let activeStream = null;
let activeRecordIndex = null;

function getPageSize() {
    if (window.matchMedia("(max-height: 520px) and (min-width: 500px)").matches) {
        return 15;
    }

    if (window.matchMedia("(max-width: 700px)").matches) {
        return 15;
    }

    return 16;
}

function say(text, lang) {
    return new Promise(resolve => {
        if (!("speechSynthesis" in window)) {
            resolve();
            return;
        }

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = lang;
        utterance.rate = 0.84;

        utterance.onend = resolve;
        utterance.onerror = resolve;

        speechSynthesis.speak(utterance);
    });
}

async function speakWord(index) {
    const word = data[index];

    if (!word) return;

    speechSynthesis.cancel();

    await say(word[1], "zh-CN");
    await say(word[0], "ru-RU");
}

function render() {
    const query = search.value.toLowerCase().trim();

    filtered = data
        .map((word, index) => [word, index])
        .filter(([word]) =>
            word.join(" ").toLowerCase().includes(query)
        );

    const pageSize = getPageSize();
    const totalPages = Math.max(
        1,
        Math.ceil(filtered.length / pageSize)
    );

    page = Math.max(0, Math.min(page, totalPages - 1));

    const start = page * pageSize;
    const visibleWords = filtered.slice(start, start + pageSize);

    count.textContent =
        `Страница ${page + 1} / ${totalPages} · ${filtered.length} слов`;

    prev.disabled = page === 0;
    next.disabled = page >= totalPages - 1;

    grid.innerHTML = visibleWords.map(([word, index]) => `
        <article class="card">

            <div class="top">
                <span class="tag">${word[5]}</span>
                <span class="emoji">${word[4]}</span>
            </div>

            <div class="ru">${word[0]}</div>

            <div class="cnrow">
                <div class="cn">${word[1]}</div>

                <div>
                    <div class="py">${word[2]}</div>
                    <div class="en">${word[3]}</div>
                </div>
            </div>

            ${word[6] ? `
                <div class="pair">↔ ${word[6]}</div>
            ` : ""}

            <div class="actions">
                <button
                    class="listen"
                    data-i="${index}"
                    type="button"
                >
                    ▶ Слушать
                </button>

                <button
                    class="record"
                    data-r="${index}"
                    type="button"
                >
                    ${rec[index] ? "🎙 Запись есть" : "🎙 Записать"}
                </button>
            </div>

            <div class="status" id="s${index}">
                ${rec[index] ? "Запись сохранена" : ""}
            </div>

        </article>
    `).join("");
}

/* Озвучивание и работа с записями */

grid.addEventListener("click", async event => {

    const listenButton = event.target.closest("[data-i]");

    if (listenButton) {
        const index = Number(listenButton.dataset.i);
        await speakWord(index);
        return;
    }

    const recordButton = event.target.closest("[data-r]");

    if (!recordButton) return;

    const index = Number(recordButton.dataset.r);

    /* Если запись уже существует — прослушиваем её */

    if (rec[index]) {
        const status = document.querySelector("#s" + index);

        status.innerHTML = "";

        const audio = new Audio(rec[index]);
        audio.controls = true;
        audio.style.width = "100%";

        status.appendChild(audio);

        const deleteButton = document.createElement("button");
        deleteButton.className = "btn";
        deleteButton.textContent = "Удалить запись";

        deleteButton.onclick = () => {
            delete rec[index];

            localStorage.removeItem("adj-rec-" + index);

            render();
        };

        status.appendChild(deleteButton);

        return;
    }

    /* Останавливаем предыдущую запись, если она была */

    if (activeRecorder) {
        if (activeRecorder.state === "recording") {
            activeRecorder.stop();
        }
    }

    /* Начинаем запись */

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            audio: true
        });

        const recorder = new MediaRecorder(stream);
        const chunks = [];

        activeRecorder = recorder;
        activeStream = stream;
        activeRecordIndex = index;

        const status = document.querySelector("#s" + index);

        recordButton.textContent = "■ Остановить";
        status.textContent = "Идёт запись... Нажмите кнопку остановки.";

        recorder.ondataavailable = event => {
            if (event.data && event.data.size > 0) {
                chunks.push(event.data);
            }
        };

        recorder.onstop = () => {
            const blob = new Blob(chunks, {
                type: recorder.mimeType || "audio/webm"
            });

            const reader = new FileReader();

            reader.onload = () => {
                try {
                    localStorage.setItem(
                        "adj-rec-" + index,
                        reader.result
                    );

                    rec[index] = reader.result;

                    render();

                } catch (error) {
                    const currentStatus =
                        document.querySelector("#s" + index);

                    if (currentStatus) {
                        currentStatus.textContent =
                            "Недостаточно места для сохранения записи.";
                    }
                }
            };

            reader.readAsDataURL(blob);

            stream.getTracks().forEach(track => track.stop());

            activeRecorder = null;
            activeStream = null;
            activeRecordIndex = null;
        };

        recorder.start();

        /* Остановка записи по повторному нажатию */

        recordButton.onclick = event => {
            event.stopPropagation();

            if (recorder.state === "recording") {
                recorder.stop();
            }
        };

    } catch (error) {
        const status = document.querySelector("#s" + index);

        if (status) {
            status.textContent =
                "Не удалось включить микрофон. Разрешите доступ к нему.";
        }
    }
});

/* Поиск */

search.addEventListener("input", () => {
    page = 0;
    render();
});

/* Переключение страниц */

prev.addEventListener("click", () => {
    if (page > 0) {
        page--;
        render();
    }
});

next.addEventListener("click", () => {
    const pageSize = getPageSize();
    const totalPages = Math.max(
        1,
        Math.ceil(filtered.length / pageSize)
    );

    if (page < totalPages - 1) {
        page++;
        render();
    }
});

/* Озвучивание всех слов */

document.querySelector("#all").addEventListener("click", async () => {
    speechSynthesis.cancel();

    for (const [word] of filtered) {
        await say(word[1], "zh-CN");
        await say(word[0], "ru-RU");
    }
});

/* Остановка озвучивания */

document.querySelector("#stop").addEventListener("click", () => {
    if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
    }
});

/* Перестраиваем карточки при изменении размера экрана */

window.addEventListener("resize", render);

/* Первоначальный вывод */

render();

</script>
</body>
</html>
